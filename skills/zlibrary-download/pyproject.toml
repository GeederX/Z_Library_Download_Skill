[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "book-tools-cli"
version = "0.1.0"
description = "Agent-independent book search and validated downloads"
readme = "references/cli.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.28,<0.29",
  "platformdirs>=4,<5",
  "beautifulsoup4>=4.13,<5",
  "defusedxml>=0.7,<0.8",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
browser = ["playwright>=1.55,<2"]

[project.urls]
Homepage = "https://github.com/GeederX/Z_Library_Download_Skill"
Repository = "https://github.com/GeederX/Z_Library_Download_Skill"
Issues = "https://github.com/GeederX/Z_Library_Download_Skill/issues"

[project.scripts]
book-tools = "book_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/book_tools"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "book_tools/skill/SKILL.md"
"LICENSE" = "book_tools/skill/LICENSE"
"pyproject.toml" = "book_tools/skill/pyproject.toml"
"uv.lock" = "book_tools/skill/uv.lock"
"requirements.lock" = "book_tools/skill/requirements.lock"
"requirements-browser.lock" = "book_tools/skill/requirements-browser.lock"
"src" = "book_tools/skill/src"
"scripts" = "book_tools/skill/scripts"
"references" = "book_tools/skill/references"
